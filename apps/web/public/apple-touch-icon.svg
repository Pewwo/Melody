<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18132b" />
      <stop offset="50%" stop-color="#0e0a1a" />
      <stop offset="100%" stop-color="#08060f" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="url(#neon)" stroke-width="3" opacity="0.4" />

  <!-- Glowing Music Note / Wave Icon -->
  <g filter="url(#glow)">
    <!-- Note Stem 1 -->
    <rect x="180" y="160" width="28" height="180" rx="14" fill="url(#neon)" />
    <!-- Note Stem 2 -->
    <rect x="304" y="120" width="28" height="220" rx="14" fill="url(#neon)" />
    <!-- Beam -->
    <path d="M 180 174 C 230 148, 270 134, 332 120 L 332 168 C 270 182, 230 196, 180 222 Z" fill="url(#neon)" />
    <!-- Note Head 1 -->
    <ellipse cx="166" cy="340" rx="42" ry="32" transform="rotate(-20 166 340)" fill="url(#neon)" />
    <!-- Note Head 2 -->
    <ellipse cx="290" cy="340" rx="42" ry="32" transform="rotate(-20 290 340)" fill="url(#neon)" />
  </g>
</svg>